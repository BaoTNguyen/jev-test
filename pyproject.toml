[project]
name = "jevbench"
version = "0.1.0"
description = "LLM alone vs LLM + decision model (Jev, SubQ Snap, Gemini Decision) on tau-bench, MedAgentBench and MCPToolBench++"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-genai>=1.30",
    "httpx>=0.27",
    "requests>=2.31",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sentry-sdk>=2.70",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jevbench = "jevbench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
