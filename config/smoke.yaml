# Offline smoke test: mock LLM + mock decision model on MCPToolBench++ only.
# python -m jevbench --config config/smoke.yaml run --no-warmup
run: {seed: 7, reps: 1, max_workers: 4, max_turns: 4, budget_usd: 1}
llms:
  - {id: mock, model: mock}
decision_models: [none, mock]
decision_providers: {mock: {model: mock}}
router: {mass: 0.95, min_k: 3, max_k: 8, escape_hatch: true, max_options: 255}
benchmarks:
  mcptoolbench: {enabled: true, categories: [finance, file_system, browser, search, map, pay], per_category: 2, surfaces: [native, all], judge: false}
  medagentbench: {enabled: false}
  tau: {enabled: false}
judge_llm: null
prices: {mock: {input: 0, output: 0}}
