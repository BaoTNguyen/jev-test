# Optional: host only the dashboard on DigitalOcean App Platform (reads Tiger Data).
# The runner + FHIR server still live on the droplet.
#   doctl apps create --spec deploy/app.yaml
name: jevbench-dashboard
region: sfo
services:
  - name: dashboard
    github:
      repo: BaoTNguyen/jev-test
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    run_command: python -m jevbench dashboard --port 8000
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /healthz
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: "paste-tiger-connection-string"
      - key: DASHBOARD_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: "change-me"
